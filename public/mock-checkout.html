<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng thanh toán PayOS (Mô phỏng)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.52.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-6 text-center">
    <div class="flex items-center justify-center space-x-2 text-emerald-600 font-extrabold text-xl mb-4">
      <i data-lucide="shield-check" class="w-6 h-6"></i>
      <span>payOS Payment Gateway</span>
    </div>

    <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs p-3 rounded-xl mb-4 text-left">
      <strong>Chế độ thử nghiệm:</strong> Trang này mô phỏng giao diện thanh toán PayOS khi đang chạy local hoặc chưa kết nối tài khoản ngân hàng thực tế.
    </div>

    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-left text-xs space-y-2 mb-6">
      <div class="flex justify-between">
        <span class="text-slate-500">Mã đơn:</span>
        <span class="font-bold text-slate-800" id="orderCode">...</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">Số tiền:</span>
        <span class="font-extrabold text-emerald-600 text-sm" id="amount">...</span>
      </div>
    </div>

    <button onclick="confirmTestPayment()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 transition flex items-center justify-center space-x-2 text-sm">
      <i data-lucide="check-circle" class="w-4 h-4"></i>
      <span>Xác nhận đã chuyển khoản thành công</span>
    </button>
  </div>

  <script>
    lucide.createIcons();
    const params = new URLSearchParams(window.location.search);
    const code = params.get('orderCode');
    const amt = params.get('amount');
    document.getElementById('orderCode').innerText = '#' + code;
    document.getElementById('amount').innerText = Number(amt || 0).toLocaleString('vi-VN') + ' đ';

    async function confirmTestPayment() {
      await fetch('/api/test/simulate-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderCode: code })
      });
      window.location.href = `/success.html?orderCode=${code}`;
    }
  </script>
</body>
</html>
