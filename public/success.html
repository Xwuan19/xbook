<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán thành công - XBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.52.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-8 text-center">
    <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/20">
      <i data-lucide="check" class="w-10 h-10 stroke-[3]"></i>
    </div>
    
    <h1 class="text-2xl font-extrabold text-slate-900">Giao dịch thành công!</h1>
    <p class="text-slate-500 text-xs sm:text-sm mt-1">Cảm ơn bạn đã tin tưởng mua sách tại XBook.</p>

    <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 my-6 text-left text-xs space-y-2">
      <div class="flex justify-between">
        <span class="text-slate-500">Mã đơn hàng:</span>
        <span class="font-mono font-bold text-slate-800" id="orderCodeDisplay">...</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">Sách:</span>
        <span class="font-semibold text-slate-800" id="courseTitleDisplay">Đang lấy thông tin...</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">Trạng thái:</span>
        <span class="text-emerald-600 font-bold bg-emerald-50 px-2 py-0.5 rounded">Đang kiểm tra</span>
      </div>
    </div>

    <p class="text-sm text-emerald-700 font-semibold" id="deliveryDisplay">Đang lấy lịch giao sách...</p>

    <a href="/" class="block mt-4 text-xs font-semibold text-slate-400 hover:text-slate-600 transition">
      ← Quay lại trang chủ XBook
    </a>
  </div>

  <script>
    lucide.createIcons();
    const statusDisplay = document.querySelector('.text-emerald-600.font-bold');
    const urlParams = new URLSearchParams(window.location.search);
    const orderCode = urlParams.get('orderCode');
    
    if (orderCode) {
      document.getElementById('orderCodeDisplay').innerText = '#' + orderCode;
      fetch(`/api/orders/${orderCode}`)
        .then(res => res.json())
        .then(res => {
          if (res.success && res.data) {
            statusDisplay.innerText = res.data.status === 'PAID' ? 'Đã thanh toán' : 'Chưa thanh toán';
            document.getElementById('courseTitleDisplay').innerText = res.data.bookTitle || res.data.courseTitle || '';
            document.getElementById('deliveryDisplay').innerText = res.data.deliveryAt
              ? 'Nhận sách: ' + new Date(res.data.deliveryAt).toLocaleDateString('vi-VN')
              : 'Theo thông báo của lớp';
          }
        })
        .catch(console.error);
    }
  </script>
</body>
</html>
