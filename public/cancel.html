<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giao dịch đã hủy - XBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.52.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-6 sm:p-8 text-center">
    <div class="w-20 h-20 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4">
      <i data-lucide="x" class="w-10 h-10 stroke-[2.5]"></i>
    </div>
    
    <h1 class="text-2xl font-extrabold text-slate-900">Giao dịch chưa hoàn tất</h1>
    <p class="text-slate-500 text-xs sm:text-sm mt-1">Bạn đã hủy thanh toán hoặc phiên giao dịch đã hết hạn.</p>

    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 my-6 text-xs text-slate-600">
      Nếu bạn gặp bất kỳ vấn đề nào trong quá trình chuyển khoản mã VietQR, đừng ngại liên hệ hỗ trợ để được trợ giúp.
    </div>

    <a 
      href="/" 
      class="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl transition flex items-center justify-center space-x-2 text-sm"
    >
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Quay lại chọn sách</span>
    </a>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
